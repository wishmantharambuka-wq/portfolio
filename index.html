<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f9f6" />

    <title>Chamod Wismantha — Data Science · Geospatial · Design</title>
    <meta
      name="description"
      content="Portfolio of Chamod Wismantha — Data Scientist in the making, Urban Informatics & Planning undergraduate at the University of Moratuwa. Data science, GIS and geospatial intelligence, and graphic design."
    />
    <meta name="author" content="Chamod Wismantha" />

    <!--
      Social share (Open Graph / Twitter).

      og:image and og:url must be ABSOLUTE URLs — social scrapers don't run JS
      and won't resolve relative paths. `%VITE_SITE_URL%` is replaced at build
      time by Vite from the VITE_SITE_URL env var; the GitHub Pages deploy
      workflow sets it to https://<owner>.github.io/<repo>/ automatically.

      Locally (VITE_SITE_URL unset) the literal remains — harmless, since
      scrapers only ever hit the deployed URL. To preview or host elsewhere,
      set VITE_SITE_URL before building.

      The image itself is public/og-image.png — export it from
      public/og-preview.html (open it, screenshot the 1200×630 card).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chamod Wismantha — Portfolio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="Chamod Wismantha — Data Science · Geospatial · Design" />
    <meta
      property="og:description"
      content="Turning spatial and urban data into decisions. Data science, GIS, and design portfolio."
    />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chamod Wismantha — Portfolio 2026" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chamod Wismantha — Data Science · Geospatial · Design" />
    <meta
      name="twitter:description"
      content="Turning spatial and urban data into decisions. Data science, GIS, and design portfolio."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; color: #1e362d; font-family: sans-serif">
        <h1>Chamod Wismantha</h1>
        <p>
          This portfolio is an interactive 3D experience and needs JavaScript enabled.
          You can still reach me at
          <a href="mailto:uni.chamod27@gmail.com" style="color: #0a6b51"
            >uni.chamod27@gmail.com</a
          >.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
